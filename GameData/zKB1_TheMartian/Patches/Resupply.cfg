@PART[IRIS]:HAS[@MODULE[Experiment]]:NEEDS[Kerbalism]:AFTER[zzzKerbalismDefault]
{
    !MODULE[Experiment],* { }
    !MODULE[Configure],* { }
    !MODULE[HardDrive],* { }
}

@PART[IRIS]:AFTER[zzzKerbalismDefault]
{
    %mass = 0.35
    @MODULE[ModuleFuelTanks]
	{
		%volume = 10000
    }
	RESOURCE
	{
		name = Food
		amount = 3200
		maxAmount = 6400
	}
	RESOURCE
	{
		name = Water
		amount = 600
		maxAmount = 1200
	}
	RESOURCE
	{
		name = Oxygen
		amount = 300000
		maxAmount = 300000
	}
	RESOURCE
	{
		name = Nitrogen
		amount = 12000
		maxAmount = 12000
	}
}
@PART[IRIS]:NEEDS[Kaboom]:AFTER[Kaboom]
{
	MODULE
	{
		name = ModuleKaboom
		delay = 12
	}
}